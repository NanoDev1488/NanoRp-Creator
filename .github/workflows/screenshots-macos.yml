name: macOS UI Verification & Preview Screenshots

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  macos-screenshots:
    name: Capture macOS App Screenshots via Playwright
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Playwright & Dependencies
        run: |
          pip install -r scripts/requirements.txt
          playwright install --with-deps

      - name: Run Automated Electron UI Tests & Capture Screenshots
        run: |
          python scripts/test_and_capture_screenshots.py

      - name: Upload macOS App Screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-macos-preview
          path: screenshots/
          retention-days: 30
