name: Build & Debloat Matrix (Windows, Linux, macOS)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v20 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            native/rust-engine/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('native/rust-engine/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup CMake & Compiler
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28.x'

      - name: Cache C++ Build Cache
        uses: actions/cache@v4
        with:
          path: native/cpp-engine/build/
          key: ${{ runner.os }}-cmake-${{ hashFiles('native/cpp-engine/CMakeLists.txt', 'native/cpp-engine/src/**') }}
          restore-keys: |
            ${{ runner.os }}-cmake-

      - name: Install Linux Dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools build-essential libfuse2

      - name: Compile Rust Engine (Release Profile)
        run: |
          cargo build --release --manifest-path native/rust-engine/Cargo.toml

      - name: Compile C++ Engine (Release Profile)
        run: |
          cmake -B native/cpp-engine/build -S native/cpp-engine -DCMAKE_BUILD_TYPE=Release
          cmake --build native/cpp-engine/build --config Release

      - name: Copy Native Engines to Binary Directory
        shell: bash
        run: |
          mkdir -p bin
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp native/rust-engine/target/release/nano-rp-rust-engine.exe bin/ || true
            cp native/cpp-engine/build/Release/nano-rp-cpp-engine.exe bin/ || cp native/cpp-engine/build/nano-rp-cpp-engine.exe bin/ || true
          else
            cp native/rust-engine/target/release/nano-rp-rust-engine bin/ || true
            cp native/cpp-engine/build/nano-rp-cpp-engine bin/ || true
            chmod +x bin/* || true
          fi

      - name: Install Node Modules
        run: npm ci

      - name: Build Electron App with 35-Stage Debloating
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            npm run dist:win -- --publish never
          elif [ "${{ runner.os }}" = "Linux" ]; then
            npm run dist:linux -- --publish never
          elif [ "${{ runner.os }}" = "macOS" ]; then
            npm run dist:mac -- --publish never
          fi

      - name: Upload Packaged Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nano-rp-creator-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.dmg
            dist/*.zip
            dist/*.tar.gz
          retention-days: 14
