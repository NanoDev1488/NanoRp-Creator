name: NanoRp-Creator Pipeline

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # SUBJOB 1: macOS Automated UI Preview & Playwright Screenshots
  test-macos:
    name: macOS UI Preview (Playwright)
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Playwright & Dependencies
        run: |
          pip install -r scripts/requirements.txt
          playwright install --with-deps

      - name: Capture macOS Screenshots via CDP
        run: |
          python scripts/test_and_capture_screenshots.py

      - name: Upload macOS Screenshots Artifact
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-macos-preview
          path: screenshots/
          retention-days: 14

  # SUBJOB 2: Multi-Platform Build Matrix (Windows, Linux, macOS)
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            native/rust-engine/target/
          key: ${{ runner.os }}-cargo-main-${{ hashFiles('native/rust-engine/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-main-

      - name: Setup MSVC Developer Prompt (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28.x'

      - name: Cache C++ Build
        uses: actions/cache@v4
        with:
          path: native/cpp-engine/build/
          key: ${{ runner.os }}-cmake-main-${{ hashFiles('native/cpp-engine/CMakeLists.txt', 'native/cpp-engine/src/**') }}
          restore-keys: |
            ${{ runner.os }}-cmake-main-

      - name: Install Linux Dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools build-essential libfuse2

      # Windows Native Compilation using CMD (bypasses Git Bash /usr/bin/link conflict)
      - name: Compile Native Engines (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cargo build --release --manifest-path native\rust-engine\Cargo.toml
          cmake -B native\cpp-engine\build -S native\cpp-engine -DCMAKE_BUILD_TYPE=Release
          cmake --build native\cpp-engine\build --config Release
          if not exist bin mkdir bin
          copy native\rust-engine\target\release\nano-rp-rust-engine.exe bin\ >nul 2>&1 || ver >nul
          copy native\cpp-engine\build\Release\nano-rp-cpp-engine.exe bin\ >nul 2>&1 || copy native\cpp-engine\build\nano-rp-cpp-engine.exe bin\ >nul 2>&1 || ver >nul

      # Unix Native Compilation using Bash
      - name: Compile Native Engines (Linux & macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cargo build --release --manifest-path native/rust-engine/Cargo.toml
          cmake -B native/cpp-engine/build -S native/cpp-engine -DCMAKE_BUILD_TYPE=Release
          cmake --build native/cpp-engine/build --config Release
          mkdir -p bin
          cp native/rust-engine/target/release/nano-rp-rust-engine bin/ || true
          cp native/cpp-engine/build/nano-rp-cpp-engine bin/ || true
          chmod +x bin/* || true

      - name: Install Node Modules
        run: npm ci

      - name: Build and 35-Stage Debloat (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: npm run dist:win -- --publish never

      - name: Build and 35-Stage Debloat (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: npm run dist:linux -- --publish never

      - name: Build and 35-Stage Debloat (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: npm run dist:mac -- --publish never

      - name: Upload Packaged Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.dmg
            dist/*.zip
            dist/*.tar.gz
          retention-days: 14

  # SUBJOB 3: Automated Multi-Platform Release Publisher
  release:
    name: Publish GitHub Release
    needs: [build, test-macos]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts/

      - name: Prepare Release Directory
        run: |
          mkdir -p release-files
          find all-artifacts -type f \( -name "*.exe" -o -name "*.AppImage" -o -name "*.dmg" -o -name "*.zip" -o -name "*.tar.gz" -o -name "*.png" \) -exec cp {} release-files/ \;
          ls -la release-files/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NanoRp-Creator ${{ github.ref_name }}
          body: |
            ## ⚡ NanoRp-Creator ${{ github.ref_name }} Release

            Сверхлегкая кроссплатформенная студия создания ресурс-паков Minecraft с нативными C++17 и Rust движками.

            ### 💎 Главные особенности релиза:
            - **C++17 & Rust Engines**: потоковая валидация PNG, ZIP-сжатие и расчет SHA-1 без нагрузки на Node.js.
            - **Интеллектуальный Parity Extender (+1px)**: автоматическое распознавание нечетных картинок (63x64, 31x32) и расширение на +1 пиксель (Edge Clamp) без искажения пиксель-арта.
            - **Визуальный редактор глифов и шрифтов**: привязка текста и эмодзи к картинкам в чате (`font/default.json`) без ручного JSON.
            - **Кастомные предметы (CustomModelData)**: наглядная привязка 3D-моделей и текстур к базовым предметам Minecraft.
            - **Облачный линкер без API-ключей**: генерация постоянной ссылки и готовой строки для `server.properties` (`resource-pack=...` и `resource-pack-sha1=...`).
            - **35-этапный Debloater**: удаление сотен мегабайт мусора Chromium, потребление ОЗУ снижено до ~40-50 МБ.
            - **Превью-скриншоты macOS**: протестировано через Playwright и включено в дистрибутив.

            ### 💬 Обратная связь и автор:
            - **Автор**: NanoDev_mc (NanoDev1488)
            - **Обратная связь**: [t.me/radoqi](https://t.me/radoqi)
            - **Telegram канал**: [t.me/WineSquad](https://t.me/WineSquad)
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
